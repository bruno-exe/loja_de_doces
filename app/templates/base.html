<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Come Doce: um espaço para compradores e vendedores de doces.">
  <title>{% block title %}Come Doce{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Página inicial do Come Doce">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span>Come <strong>Doce</strong></span>
    </a>
    <nav aria-label="Navegação principal">
      <a href="/#como-funciona">Como funciona</a>
      <a class="button button-small" href="/cadastro">Criar conta</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <p>&copy; 2026 Come Doce. Ambiente local de desenvolvimento.</p>
  </footer>
</body>
</html>
