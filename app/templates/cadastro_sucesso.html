{% extends "base.html" %}
{% block title %}Conta criada · Come Doce{% endblock %}
{% block content %}
<section class="success-page">
  <div class="success-card">
    <span class="success-icon" aria-hidden="true">✓</span>
    <span class="eyebrow">Cadastro concluído</span>
    <h1>Sua conta foi criada!</h1>
    <p>Tipo de conta: <strong>{{ account_label }}</strong></p>
    <p>Agora você já pode entrar e acessar seu perfil.</p>
    <a class="button" href="/login">Entrar na minha conta</a>
  </div>
</section>
{% endblock %}
